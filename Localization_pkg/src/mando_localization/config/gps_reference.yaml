reference:
  # first_fix는 지도 없이 개발할 때만 쓴다. 실제 map 사용 시 manual_datum으로 바꾼다.
  mode: first_fix
  measured: false
  measured_at: ""
  source: ""
  latitude_deg: 0.0
  longitude_deg: 0.0
  altitude_m: 0.0
  yaw_offset_rad: 0.0
  map_x_m: 0.0
  map_y_m: 0.0
  map_z_m: 0.0
  require_measured_datum_for_lidar: true

quality:
  minimum_fix_status: 0
  max_message_age_sec: 1.0
  max_future_stamp_sec: 0.10
  fallback_horizontal_variance_m2: 25.0
  fallback_vertical_variance_m2: 100.0
  max_horizontal_variance_m2: 25.0
  max_vertical_variance_m2: 100.0
  max_step_distance_m: 50.0
  unobserved_variance: 1000000.0
  max_position_innovation_m: 10.0
  max_mahalanobis_distance: 5.0
  max_reanchor_candidate_distance_m: 2.0
